name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go — gofmt, vet, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (generates go.sum on first run)
        run: go mod tidy && go test ./...

  ai-service:
    name: Python — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-vision-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-vision-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests -q

  web:
    name: Web — type-check, build, vitest (axe-core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: Web — Playwright E2E (keyboard + axe, both locales)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  docker:
    name: Docker — build all images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend service images
        run: |
          for svc in api-gateway catalog order alttext-worker; do
            docker build --build-arg SERVICE="$svc" -t "vitrine:$svc" backend
          done
      - name: Build ai-vision-service (stub pipeline)
        run: docker build -t vitrine:ai ai-vision-service
      - name: Build web
        run: docker build -t vitrine:web web
      - name: Validate docker-compose file
        run: docker compose config -q
